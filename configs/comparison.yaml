# Self-Geometry paper schedule; Test3R uses the same 50-update budget.
method: self_geometry
test3r_epochs: 2
test3r_accum: 4
test3r_prompt_size: 32
test3r_vggt_points: native
test3r_lr: 0.00001
test3r_max_updates: 50
test3r_max_triplets: 1000
test3r_pair_batch: 2
tco_steps: null
tco_lr: null
tco_photo_weight: null
tco_intrinsics_weight: 0.0
tco_checkpointing: true
tco_training_sampling: official_sparse_v1
tco_train_image_size: 518
tco_pose_rot_loss: angle
checkpoint_every: 25
fused_optimizer: true
