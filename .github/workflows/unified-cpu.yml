name: Unified protocol CPU
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[sift,dev]'
      - run: pytest tests -q
      - run: ruff check src/free_geometry tests/unified
      - run: python -m build --wheel
