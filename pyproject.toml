[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "depth-anything-3"
version = "0.0.0"
description = "Depth Anything 3"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "CC-BY-4.0" }
authors = [{ name = "Your Name" }]

dependencies = ["torch>=2.3", "numpy>=1.24,<3", "pillow>=9", "pyyaml>=6"]


[project.optional-dependencies]
sift = ["opencv-python-headless>=4.8"]
models = ["torchvision", "einops", "huggingface_hub", "safetensors", "peft>=0.14", "omegaconf", "addict", "e3nn", "opencv-python-headless>=4.8", "pillow_heif", "imageio", "tqdm"]
benchmark = ["open3d", "evo", "trimesh", "plyfile", "pycolmap", "scipy", "imageio", "tqdm"]
app = ["gradio>=5", "fastapi", "uvicorn", "moviepy==1.0.3", "typer>=0.9.0"]
dev = ["pytest>=8", "build", "ruff"]
gs = ["gsplat @ git+https://github.com/nerfstudio-project/gsplat.git@0b4dddf04cb687367602c01196913cde6a743d70"]
all = ["depth-anything-3[sift,models,benchmark,app,gs]"]

[project.scripts]
da3 = "depth_anything_3.cli:app"
fg = "free_geometry.cli:main"

[project.urls]
Homepage = "https://github.com/ByteDance-Seed/Depth-Anything-3"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/depth_anything_3", "src/free_geometry", "src/vggt/vggt"]

[tool.hatch.build.targets.wheel.sources]
"src/vggt/vggt" = "vggt"
"src/free_geometry" = "free_geometry"
"src/depth_anything_3" = "depth_anything_3"

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/pyproject.toml",
  "/src/depth_anything_3",
  "/src/free_geometry",
  "/src/vggt/vggt",
  "/configs",
  "/tests",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
plugins = ["jaxtyping.mypy_plugin"]

[tool.black]
line-length = 99
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
  | \.git
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
known_third_party = ["bson","cruise","cv2","dataloader","diffusers","omegaconf","tensorflow","torch","torchvision","transformers","gsplat"]
known_first_party = ["common", "data", "models", "projects"]
sections = ["FUTURE","STDLIB","THIRDPARTY","FIRSTPARTY","LOCALFOLDER"]
skip_gitignore = true
line_length = 99
no_lines_before="THIRDPARTY"
