[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "self-geometry-reproduction"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch", "numpy", "PyYAML", "opencv-python", "open3d"]
[project.scripts]
selfgeom = "self_geometry.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src", "vendor/vggt", "vendor/da3"]
